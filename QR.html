<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 다운로드로 이동 중...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>원스토어로 이동하고 있습니다...</h2>
        <p>잠시 후에도 이동하지 않으면 아래 버튼을 눌러주세요.</p>
        <a id="manual-link" href="#" style="display:inline-block; padding:10px 20px; background:#ff415c; color:#fff; text-decoration:none; border-radius:5px;">원스토어로 이동</a>
    </div>

    <script>
        // TODO: 본인 앱의 원스토어 상품 ID (예: OA00123456) 입력
        const productId = "0001006359"; 

        // 1. 주소 정의
        const appScheme = `onestore://common/product/bg_detail/${productId}`;
        const webUrl = `https://m.onestore.co.kr/mobilepoc/web/main.omp?prodId=${productId}`;

        // 수동 버튼에도 링크 지정
        document.getElementById('manual-link').href = webUrl;

        // 2. 실행 로직
        const startTime = Date.now();

        // [STEP A] 먼저 원스토어 앱 실행 시도 (커스텀 스킴 호출)
        window.location.href = appScheme;

        // [STEP B] 예외 처리 (Fallback)
        // 앱이 설치되어 있다면 화면이 원스토어 앱으로 전환되면서 브라우저 타이머가 일시정지됩니다.
        // 앱이 없다면 브라우저가 계속 켜져 있으므로, 1.5초 후에 아래 타이머가 작동하여 웹 페이지로 이동시킵니다.
        setTimeout(function() {
            const endTime = Date.now();
            
            // 사용자가 앱으로 빠져나가지 않고 웹 브라우저에 그대로 머물러 있는 경우 (시간 차가 크지 않음)
            if (endTime - startTime < 2000) {
                window.location.href = webUrl;
            }
        }, 1500); // 1.5초 대기
    </script>
</body>
</html>
